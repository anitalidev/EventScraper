<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Queue — Instagram Event Scraper</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0d0d0d;
    --surface:  #161616;
    --surface2: #1f1f1f;
    --border:   #272727;
    --border2:  #333;
    --text:     #e0e0e0;
    --muted:    #666;
    --muted2:   #999;
    --green:    #22c55e;
    --green-bg: #052e16;
    --amber:    #f59e0b;
    --amber-bg: #1c1000;
    --red:      #ef4444;
    --red-bg:   #1f0808;
    --accent:   #e1306c;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Layout ──────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 52px;
    display: flex; align-items: center; gap: 1.5rem;
  }
  .topbar-brand {
    font-size: 0.95rem; font-weight: 700;
    background: linear-gradient(90deg, #e1306c, #d6249f);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .topbar-nav { display: flex; gap: 0.1rem; }
  .topbar-nav a {
    font-size: 0.82rem; color: var(--muted2);
    text-decoration: none; padding: 0.35rem 0.7rem;
    border-radius: 6px; transition: background 0.15s, color 0.15s;
  }
  .topbar-nav a:hover { background: var(--surface2); color: var(--text); }
  .topbar-nav a.active { background: var(--surface2); color: var(--text); }
  .topbar-spacer { flex: 1; }
  #countBadges { display: flex; gap: 0.5rem; }

  .layout { display: flex; height: calc(100vh - 52px); overflow: hidden; }

  /* ── Sidebar ──────────────────────────────────────────────────────────── */
  .sidebar {
    width: 220px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 1.2rem 0.9rem;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 0.25rem;
  }
  .sidebar-label {
    font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted);
    padding: 0 0.5rem; margin: 0.8rem 0 0.3rem;
  }
  .sidebar-label:first-child { margin-top: 0; }
  .sidebar-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.42rem 0.6rem;
    border-radius: 7px; border: none; background: transparent;
    color: var(--muted2); font-size: 0.85rem; cursor: pointer;
    transition: background 0.12s, color 0.12s; width: 100%; text-align: left;
  }
  .sidebar-btn:hover { background: var(--surface2); color: var(--text); }
  .sidebar-btn.active { background: var(--surface2); color: var(--text); font-weight: 600; }
  .sidebar-count {
    font-size: 0.72rem; padding: 0.1rem 0.45rem;
    border-radius: 999px; background: var(--surface2); color: var(--muted2);
  }
  .sidebar-btn.active .sidebar-count { background: var(--border2); }

  /* ── Main content ─────────────────────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .toolbar {
    padding: 0.9rem 1.4rem;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 0.75rem; align-items: center; flex-shrink: 0;
  }
  .search-wrap { position: relative; flex: 1; max-width: 380px; }
  .search-wrap input {
    width: 100%;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text);
    padding: 0.48rem 0.8rem 0.48rem 2.1rem;
    font-size: 0.88rem; outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 0.9rem; pointer-events: none;
  }
  .type-select {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text);
    padding: 0.48rem 0.7rem; font-size: 0.85rem; outline: none; cursor: pointer;
  }
  .type-select option { background: var(--surface); }

  /* bulk bar */
  #bulkBar {
    display: none; align-items: center; gap: 0.75rem;
    margin-left: auto;
  }
  #bulkBar.visible { display: flex; }
  #selectedCount { font-size: 0.82rem; color: var(--muted2); }
  .bulk-btn {
    font-size: 0.8rem; font-weight: 600; padding: 0.38rem 0.9rem;
    border-radius: 7px; border: 1px solid; cursor: pointer;
    transition: opacity 0.15s;
  }
  .bulk-btn:hover { opacity: 0.8; }
  .bulk-approve { background: var(--green-bg); color: var(--green); border-color: #166534; }
  .bulk-reject  { background: var(--red-bg);   color: var(--red);   border-color: #7f1d1d; }
  .bulk-clear   { background: transparent; color: var(--muted2); border-color: var(--border2); }

  /* event list */
  .event-list { flex: 1; overflow-y: auto; padding: 1rem 1.4rem; }
  .empty-state {
    text-align: center; padding: 4rem 1rem;
    color: var(--muted); font-size: 0.9rem;
  }

  /* event row */
  .event-row {
    display: flex; align-items: flex-start; gap: 0.8rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    margin-bottom: 0.65rem;
    transition: border-color 0.15s;
  }
  .event-row.published { border-left-color: var(--green); }
  .event-row.review    { border-left-color: var(--amber); }
  .event-row.rejected  { border-left-color: var(--red); opacity: 0.6; }
  .event-row.selected  { background: #1a1020; border-color: #5a1a5a; }

  .row-check { padding-top: 0.1rem; }
  .row-check input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

  .row-body { flex: 1; min-width: 0; }
  .row-header { display: flex; align-items: flex-start; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
  .row-title { font-size: 0.93rem; font-weight: 600; flex: 1; min-width: 0; }
  .badge {
    font-size: 0.68rem; font-weight: 600; padding: 0.15rem 0.5rem;
    border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-published { background: var(--green-bg); color: var(--green); }
  .badge-review    { background: var(--amber-bg); color: var(--amber); }
  .badge-rejected  { background: var(--red-bg);   color: var(--red); }
  .badge-type      { background: var(--surface2);  color: var(--muted2); }

  .row-meta { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; font-size: 0.78rem; color: var(--muted2); margin-bottom: 0.35rem; }
  .row-meta span { display: flex; align-items: center; gap: 0.2rem; }
  .row-desc { font-size: 0.82rem; color: #bbb; line-height: 1.5; margin-bottom: 0.4rem; }

  .conf-row { display: flex; align-items: center; gap: 0.5rem; }
  .conf-bar-wrap { flex: 1; max-width: 120px; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .conf-bar { height: 100%; border-radius: 2px; }
  .conf-high   { background: var(--green); }
  .conf-medium { background: var(--amber); }
  .conf-low    { background: var(--red); }
  .conf-label { font-size: 0.72rem; color: var(--muted); }
  .conf-reason { font-size: 0.72rem; color: var(--muted); font-style: italic; margin-left: 0.3rem; }

  .row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-direction: column; align-items: flex-end; }
  .action-btn {
    font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.7rem;
    border-radius: 6px; border: 1px solid; cursor: pointer; white-space: nowrap;
    transition: opacity 0.15s; background: transparent;
  }
  .action-btn:hover { opacity: 0.75; }
  .btn-approve { color: var(--green); border-color: #166534; }
  .btn-reject  { color: var(--red);   border-color: #7f1d1d; }
  .btn-edit    { color: var(--muted2); border-color: var(--border2); }
  .btn-review  { color: var(--amber);  border-color: #78350f; }
  .action-btn:disabled { opacity: 0.3; cursor: default; }
  .ig-link { font-size: 0.75rem; color: var(--accent); text-decoration: none; }
  .ig-link:hover { text-decoration: underline; }

  /* ── Edit modal ────────────────────────────────────────────────────────── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 1.75rem;
    width: min(560px, 95vw);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1.2rem; }
  .modal-fields { display: flex; flex-direction: column; gap: 0.9rem; }
  .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
  .modal-field { display: flex; flex-direction: column; gap: 0.3rem; }
  .modal-field label { font-size: 0.76rem; color: var(--muted2); }
  .modal-field input,
  .modal-field select,
  .modal-field textarea {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text);
    padding: 0.5rem 0.7rem; font-size: 0.88rem; outline: none;
    transition: border-color 0.15s; font-family: inherit;
  }
  .modal-field input:focus,
  .modal-field select:focus,
  .modal-field textarea:focus { border-color: var(--accent); }
  .modal-field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .modal-field select option { background: var(--surface); }
  .modal-footer {
    display: flex; gap: 0.6rem; justify-content: flex-end;
    margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--border);
  }
  .modal-btn {
    font-size: 0.86rem; font-weight: 600; padding: 0.5rem 1.2rem;
    border-radius: 8px; border: none; cursor: pointer; transition: opacity 0.15s;
  }
  .modal-btn:hover { opacity: 0.85; }
  .modal-save    { background: var(--accent); color: #fff; }
  .modal-approve { background: var(--green-bg); color: var(--green); border: 1px solid #166534; }
  .modal-cancel  { background: var(--surface2); color: var(--muted2); }
  .modal-err { font-size: 0.8rem; color: var(--red); margin-top: 0.5rem; display: none; }

  /* toast */
  #toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 0.75rem 1.2rem;
    font-size: 0.85rem; color: var(--text);
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    transform: translateY(20px); opacity: 0;
    transition: transform 0.25s, opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { border-color: #166534; color: var(--green); }
  #toast.error   { border-color: #7f1d1d; color: var(--red); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="topbar-brand">Event Scraper</span>
  <nav class="topbar-nav">
    <a href="/">Scraper</a>
    <a href="/review" class="active">Review Queue</a>
  </nav>
  <div class="topbar-spacer"></div>
  <div id="countBadges"></div>
</div>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <span class="sidebar-label">Status</span>
    <button class="sidebar-btn" data-status="" onclick="setFilter('status','',this)">
      All <span class="sidebar-count" id="cnt-all">–</span>
    </button>
    <button class="sidebar-btn active" data-status="review" onclick="setFilter('status','review',this)">
      Review <span class="sidebar-count" id="cnt-review">–</span>
    </button>
    <button class="sidebar-btn" data-status="published" onclick="setFilter('status','published',this)">
      Published <span class="sidebar-count" id="cnt-published">–</span>
    </button>
    <button class="sidebar-btn" data-status="rejected" onclick="setFilter('status','rejected',this)">
      Rejected <span class="sidebar-count" id="cnt-rejected">–</span>
    </button>

    <span class="sidebar-label">Type</span>
    <button class="sidebar-btn active-type" data-type="" onclick="setFilter('type','',this)">All types</button>
    <button class="sidebar-btn" data-type="Workshop"   onclick="setFilter('type','Workshop',this)">Workshop</button>
    <button class="sidebar-btn" data-type="Networking" onclick="setFilter('type','Networking',this)">Networking</button>
    <button class="sidebar-btn" data-type="Career"     onclick="setFilter('type','Career',this)">Career</button>
    <button class="sidebar-btn" data-type="Social"     onclick="setFilter('type','Social',this)">Social</button>
    <button class="sidebar-btn" data-type="Academic"   onclick="setFilter('type','Academic',this)">Academic</button>
    <button class="sidebar-btn" data-type="Sports"     onclick="setFilter('type','Sports',this)">Sports</button>
    <button class="sidebar-btn" data-type="Wellness"   onclick="setFilter('type','Wellness',this)">Wellness</button>
    <button class="sidebar-btn" data-type="Volunteer"  onclick="setFilter('type','Volunteer',this)">Volunteer</button>
    <button class="sidebar-btn" data-type="Arts"       onclick="setFilter('type','Arts',this)">Arts</button>
    <button class="sidebar-btn" data-type="Culture"    onclick="setFilter('type','Culture',this)">Culture</button>
    <button class="sidebar-btn" data-type="Food"       onclick="setFilter('type','Food',this)">Food</button>
    <button class="sidebar-btn" data-type="Other"      onclick="setFilter('type','Other',this)">Other</button>
  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="text" placeholder="Search title, organizer, location…"
               oninput="debounceLoad()">
      </div>

      <div id="bulkBar">
        <span id="selectedCount"></span>
        <button class="bulk-btn bulk-approve" onclick="bulkAction('published')">✓ Approve all</button>
        <button class="bulk-btn bulk-reject"  onclick="bulkAction('rejected')">✕ Reject all</button>
        <button class="bulk-btn bulk-clear"   onclick="clearSelection()">Clear</button>
      </div>
    </div>

    <!-- Event list -->
    <div class="event-list" id="eventList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModalOnBackdrop(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Edit event</h2>
    <input type="hidden" id="editId">
    <div class="modal-fields">
      <div class="modal-field">
        <label>Title *</label>
        <input id="editTitle" type="text">
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>Date (YYYY-MM-DD)</label>
          <input id="editDate" type="date">
        </div>
        <div class="modal-field">
          <label>Time (HH:MM)</label>
          <input id="editTime" type="time">
        </div>
      </div>
      <div class="modal-field">
        <label>Location</label>
        <input id="editLocation" type="text">
      </div>
      <div class="modal-field">
        <label>Organizer</label>
        <input id="editOrganizer" type="text">
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>Event type</label>
          <select id="editType">
            <option>Workshop</option><option>Networking</option><option>Career</option>
            <option>Social</option><option>Academic</option><option>Sports</option>
            <option>Wellness</option><option>Volunteer</option><option>Arts</option>
            <option>Culture</option><option>Food</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="modal-field">
        <label>Description</label>
        <textarea id="editDesc"></textarea>
      </div>
    </div>
    <div class="modal-err" id="modalErr"></div>
    <div class="modal-footer">
      <button class="modal-btn modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn modal-save"   onclick="saveEdit()">Save changes</button>
      <button class="modal-btn modal-approve" onclick="saveAndApprove()">Save &amp; Approve</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  const state = { status: 'review', type: '', q: '' };
  let _debounce = null;
  const _selected = new Set();   // selected event IDs
  let _rows = [];                // current rendered rows

  // ── Boot ───────────────────────────────────────────────────────────────
  loadCounts();
  loadEvents();

  // ── Sidebar filter ─────────────────────────────────────────────────────
  function setFilter(key, value, btn) {
    if (key === 'status') {
      document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.status = value;
    } else {
      document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active-type'));
      btn.classList.add('active-type');
      state.type = value;
    }
    clearSelection();
    loadEvents();
  }

  // ── Search (debounced) ─────────────────────────────────────────────────
  function debounceLoad() {
    clearTimeout(_debounce);
    _debounce = setTimeout(() => { state.q = document.getElementById('searchInput').value; loadEvents(); }, 280);
  }

  // ── Load events ────────────────────────────────────────────────────────
  async function loadEvents() {
    const p = new URLSearchParams();
    if (state.status)  p.set('status',     state.status);
    if (state.type)    p.set('event_type', state.type);
    if (state.q)       p.set('q',          state.q);

    try {
      const resp = await fetch('/api/events?' + p);
      _rows = await resp.json();
      renderList(_rows);
    } catch (e) {
      document.getElementById('eventList').innerHTML =
        `<div class="empty-state">Failed to load: ${esc(e.message)}</div>`;
    }
  }

  async function loadCounts() {
    try {
      const counts = await fetch('/api/events/counts').then(r => r.json());
      const total  = Object.values(counts).reduce((a,b) => a+b, 0);
      document.getElementById('cnt-all').textContent      = total;
      document.getElementById('cnt-review').textContent    = counts.review    || 0;
      document.getElementById('cnt-published').textContent = counts.published  || 0;
      document.getElementById('cnt-rejected').textContent  = counts.rejected   || 0;

      const badges = document.getElementById('countBadges');
      badges.innerHTML = `
        <span style="font-size:.78rem;color:var(--amber)">${counts.review||0} pending review</span>
      `;
    } catch {}
  }

  // ── Render list ────────────────────────────────────────────────────────
  function renderList(rows) {
    const list = document.getElementById('eventList');
    if (!rows.length) {
      list.innerHTML = '<div class="empty-state">No events match the current filter.</div>';
      return;
    }
    list.innerHTML = '';
    for (const ev of rows) {
      list.appendChild(buildRow(ev));
    }
    updateBulkBar();
  }

  function buildRow(ev) {
    const div = document.createElement('div');
    div.className = `event-row ${ev.status}${_selected.has(ev.id) ? ' selected' : ''}`;
    div.dataset.id = ev.id;

    const conf    = ev.confidence ?? 0;
    const confPct = Math.round(conf * 100);
    const confCls = conf >= 0.85 ? 'conf-high' : conf >= 0.55 ? 'conf-medium' : 'conf-low';

    const isPublished = ev.status === 'published';
    const isRejected  = ev.status === 'rejected';

    div.innerHTML = `
      <div class="row-check">
        <input type="checkbox" ${_selected.has(ev.id) ? 'checked' : ''}
               onchange="toggleSelect(${ev.id}, this.checked, event)">
      </div>
      <div class="row-body">
        <div class="row-header">
          <div class="row-title">${esc(ev.title || '(Untitled)')}</div>
          <span class="badge badge-${ev.status}">${ev.status}</span>
          <span class="badge badge-type">${esc(ev.event_type || 'Other')}</span>
        </div>
        <div class="row-meta">
          ${ev.organizer ? `<span>👤 @${esc(ev.organizer)}</span>` : ''}
          ${ev.date      ? `<span>📅 ${esc(ev.date)}</span>`       : ''}
          ${ev.time      ? `<span>🕐 ${esc(ev.time)}</span>`       : ''}
          ${ev.location  ? `<span>📍 ${esc(ev.location)}</span>`   : ''}
        </div>
        ${ev.description ? `<div class="row-desc">${esc(ev.description)}</div>` : ''}
        <div class="conf-row">
          <div class="conf-bar-wrap"><div class="conf-bar ${confCls}" style="width:${confPct}%"></div></div>
          <span class="conf-label">${confPct}% confidence</span>
          ${ev.confidence_reason ? `<span class="conf-reason">— ${esc(ev.confidence_reason)}</span>` : ''}
        </div>
        ${ev.source_url ? `<div style="margin-top:.4rem"><a class="ig-link" href="${esc(ev.source_url)}" target="_blank" rel="noopener">View post ↗</a></div>` : ''}
      </div>
      <div class="row-actions">
        <button class="action-btn btn-approve" onclick="setStatus(${ev.id},'published')"
                ${isPublished ? 'disabled' : ''}>✓ Approve</button>
        <button class="action-btn btn-reject"  onclick="setStatus(${ev.id},'rejected')"
                ${isRejected  ? 'disabled' : ''}>✕ Reject</button>
        ${!isRejected && !isPublished ? '' :
          `<button class="action-btn btn-review" onclick="setStatus(${ev.id},'review')">↩ Review</button>`}
        <button class="action-btn btn-edit" onclick="openModal(${ev.id})">✎ Edit</button>
      </div>
    `;
    return div;
  }

  // ── Single-event status change ─────────────────────────────────────────
  async function setStatus(id, status) {
    try {
      const resp = await fetch(`/api/events/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
      toast(`Event ${status === 'published' ? 'approved' : status}`, 'success');
      loadCounts();
      loadEvents();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── Selection ──────────────────────────────────────────────────────────
  function toggleSelect(id, checked, e) {
    e.stopPropagation();
    if (checked) _selected.add(id); else _selected.delete(id);
    const row = document.querySelector(`.event-row[data-id="${id}"]`);
    if (row) row.classList.toggle('selected', checked);
    updateBulkBar();
  }

  function clearSelection() {
    _selected.clear();
    document.querySelectorAll('.event-row').forEach(r => r.classList.remove('selected'));
    document.querySelectorAll('.event-row input[type=checkbox]').forEach(c => c.checked = false);
    updateBulkBar();
  }

  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    const cnt = document.getElementById('selectedCount');
    const n   = _selected.size;
    if (n > 0) {
      bar.classList.add('visible');
      cnt.textContent = `${n} selected`;
    } else {
      bar.classList.remove('visible');
    }
  }

  // ── Bulk action ────────────────────────────────────────────────────────
  async function bulkAction(status) {
    const ids = [..._selected];
    if (!ids.length) return;
    try {
      const resp = await fetch('/api/events/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids, status }),
      });
      if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
      const { updated } = await resp.json();
      toast(`${updated} event${updated !== 1 ? 's' : ''} ${status === 'published' ? 'approved' : 'rejected'}`, 'success');
      clearSelection();
      loadCounts();
      loadEvents();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── Edit modal ─────────────────────────────────────────────────────────
  async function openModal(id) {
    try {
      const ev = await fetch(`/api/events/${id}`).then(r => r.json());
      document.getElementById('editId').value       = ev.id;
      document.getElementById('editTitle').value    = ev.title || '';
      document.getElementById('editDate').value     = ev.date  || '';
      document.getElementById('editTime').value     = ev.time  || '';
      document.getElementById('editLocation').value = ev.location || '';
      document.getElementById('editOrganizer').value= ev.organizer || '';
      document.getElementById('editDesc').value     = ev.description || '';
      document.getElementById('editType').value     = ev.event_type || 'Other';
      document.getElementById('modalErr').style.display = 'none';
      document.getElementById('modalBackdrop').classList.add('open');
      document.getElementById('editTitle').focus();
    } catch (e) { toast('Failed to load event: ' + e.message, 'error'); }
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  function closeModalOnBackdrop(e) {
    if (e.target === document.getElementById('modalBackdrop')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function collectModalFields() {
    return {
      title:       document.getElementById('editTitle').value.trim(),
      date:        document.getElementById('editDate').value     || null,
      time:        document.getElementById('editTime').value     || null,
      location:    document.getElementById('editLocation').value.trim() || null,
      organizer:   document.getElementById('editOrganizer').value.trim() || null,
      description: document.getElementById('editDesc').value.trim() || null,
      event_type:  document.getElementById('editType').value,
    };
  }

  async function saveEdit(thenApprove = false) {
    const id     = document.getElementById('editId').value;
    const fields = collectModalFields();
    const errEl  = document.getElementById('modalErr');

    if (!fields.title) { errEl.textContent = 'Title is required.'; errEl.style.display = 'block'; return; }

    try {
      const resp = await fetch(`/api/events/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fields),
      });
      if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);

      if (thenApprove) {
        await fetch(`/api/events/${id}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'published' }),
        });
        toast('Saved and approved', 'success');
      } else {
        toast('Changes saved', 'success');
      }

      closeModal();
      loadCounts();
      loadEvents();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  function saveAndApprove() { saveEdit(true); }

  // ── Toast ──────────────────────────────────────────────────────────────
  let _toastTimer = null;
  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ''; }, 2800);
  }

  // ── Util ───────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
