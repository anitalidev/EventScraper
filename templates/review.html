<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Rejected — Event Hub</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0d0d0d;
    --surface:  #161616;
    --surface2: #1f1f1f;
    --border:   #272727;
    --border2:  #333;
    --text:     #e0e0e0;
    --muted:    #666;
    --muted2:   #999;
    --amber:    #f59e0b;
    --amber-bg: #1c1000;
    --red:      #ef4444;
    --red-bg:   #1f0808;
    --accent:   #e1306c;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .topbar { position: sticky; top: 0; z-index: 100; background: rgba(13,13,13,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 52px; display: flex; align-items: center; gap: 1.5rem; }
  .topbar-brand { font-size: 0.95rem; font-weight: 700; background: linear-gradient(90deg,#e1306c,#d6249f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
  .topbar-nav { display: flex; gap: 0.1rem; }
  .topbar-nav a { font-size: 0.82rem; color: var(--muted2); text-decoration: none; padding: 0.35rem 0.7rem; border-radius: 6px; transition: background .15s,color .15s; }
  .topbar-nav a:hover { background: var(--surface2); color: var(--text); }
  .topbar-nav a.active { background: var(--surface2); color: var(--text); }
  .topbar-spacer { flex: 1; }
  .topbar-count { font-size: 0.78rem; color: var(--red); }

  .main { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.4rem; }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.75rem; }
  .page-title { font-size: 1.1rem; font-weight: 700; }
  .page-title span { font-size: 0.82rem; font-weight: 400; color: var(--muted2); margin-left: 0.5rem; }

  .toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
  .search-wrap input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 0.48rem 0.8rem 0.48rem 2.1rem; font-size: 0.88rem; outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 0.62rem; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }

  .btn-delete-all { font-size: 0.8rem; font-weight: 600; padding: 0.42rem 1rem; border-radius: 7px; border: 1px solid #5a1a1a; background: #1a0a0a; color: #f87171; cursor: pointer; transition: opacity .15s; white-space: nowrap; }
  .btn-delete-all:hover { opacity: 0.8; }
  .btn-delete-all:disabled { opacity: 0.35; cursor: not-allowed; }

  /* bulk bar */
  #bulkBar { display: none; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem; background: var(--surface); border: 1px solid var(--border2); border-radius: 9px; margin-bottom: 0.9rem; flex-wrap: wrap; }
  #bulkBar.visible { display: flex; }
  #selectedCount { font-size: 0.82rem; color: var(--muted2); flex: 1; }
  .bulk-btn { font-size: 0.8rem; font-weight: 600; padding: 0.38rem 0.9rem; border-radius: 7px; border: 1px solid; cursor: pointer; transition: opacity .15s; display: flex; align-items: center; gap: 0.35rem; }
  .bulk-btn:hover { opacity: 0.8; }
  .bulk-review { background: var(--amber-bg); color: var(--amber); border-color: #78350f; }
  .bulk-delete  { background: #1a0a0a; color: #f87171; border-color: #5a1a1a; }
  .bulk-clear   { background: transparent; color: var(--muted2); border-color: var(--border2); }

  /* event row */
  .event-row { display: flex; align-items: flex-start; gap: 0.8rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: 10px; margin-bottom: 0.65rem; opacity: 0.75; transition: opacity .15s; }
  .event-row.selected { background: #1a0a0a; border-color: #5a1a1a; opacity: 1; }
  .event-row:hover { opacity: 1; }
  .row-check { padding-top: 0.1rem; }
  .row-check input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--red); }
  .row-body { flex: 1; min-width: 0; }
  .row-header { display: flex; align-items: flex-start; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
  .row-title { font-size: 0.93rem; font-weight: 600; flex: 1; min-width: 0; }
  .row-meta { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; font-size: 0.78rem; color: var(--muted2); margin-bottom: 0.35rem; }
  .row-meta span { display: flex; align-items: center; gap: 0.3rem; }
  .row-desc { font-size: 0.82rem; color: #bbb; line-height: 1.5; margin-bottom: 0.4rem; }
  .ig-link { font-size: 0.75rem; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem; margin-top: 0.4rem; }
  .ig-link:hover { text-decoration: underline; }
  .vibe-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
  .vibe-tag { font-size: 0.68rem; padding: 0.12rem 0.45rem; border-radius: 999px; background: #1a1a2e; color: #818cf8; border: 1px solid #3730a3; }
  .row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-direction: column; align-items: flex-end; }
  .action-btn { font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid; cursor: pointer; white-space: nowrap; transition: opacity .15s; background: transparent; display: flex; align-items: center; gap: 0.3rem; }
  .action-btn:hover { opacity: 0.75; }
  .btn-review  { color: var(--amber); border-color: #78350f; }
  .btn-delete  { color: #f87171; border-color: #5a1a1a; }

  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); font-size: 0.9rem; }

  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 0.75rem 1.2rem; font-size: 0.85rem; color: var(--text); box-shadow: 0 8px 30px rgba(0,0,0,.4); transform: translateY(20px); opacity: 0; transition: transform .25s,opacity .25s; pointer-events: none; }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { border-color: #78350f; color: var(--amber); }
  #toast.error   { border-color: #7f1d1d; color: var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">Event Hub</span>
  <nav class="topbar-nav">
    <a href="/">Instagram Scraper</a>
    <a href="/review" class="active">Manage Rejected</a>
    <a href="/hub">The Hub <span style="font-size:0.68rem;font-weight:700;padding:0.15rem 0.45rem;border-radius:999px;background:#1a0a1a;color:#c084fc;border:1px solid #5b21b6;">alpha</span></a>
    <a href="/email-scraper">Email Scraper</a>
  </nav>
  <div class="topbar-spacer"></div>
  <span class="topbar-count" id="topbarCount"></span>
</div>

<div class="main">
  <div class="page-header">
    <div class="page-title">Manage Rejected <span id="countLabel"></span></div>
    <button class="btn-delete-all" id="deleteAllBtn" onclick="deleteAllRejected()">Delete all rejected</button>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      </span>
      <input id="searchInput" type="text" placeholder="Search title, organizer, location…" oninput="debounceLoad()">
    </div>
  </div>

  <div id="bulkBar">
    <span id="selectedCount"></span>
    <button class="bulk-btn bulk-review" onclick="bulkReturnToReview()">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4H2V2"/><path d="M2 4a6 6 0 1 1 .9 6"/></svg>
      Return to review
    </button>
    <button class="bulk-btn bulk-delete" onclick="bulkDeleteSelected()">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M5 5l.5 8h5l.5-8"/></svg>
      Delete selected
    </button>
    <button class="bulk-btn bulk-clear" onclick="clearSelection()">Clear</button>
  </div>

  <div id="eventList"><div class="empty-state">Loading…</div></div>
</div>

<div id="toast"></div>

<script>
  const IC = {
    person:   `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>`,
    calendar: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M5 1v4M11 1v4M2 7h12"/></svg>`,
    clock:    `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2.5 1.5"/></svg>`,
    pin:      `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5C5.5 1.5 3.5 3.5 3.5 6c0 3.5 4.5 8.5 4.5 8.5s4.5-5 4.5-8.5C12.5 3.5 10.5 1.5 8 1.5z"/><circle cx="8" cy="6" r="1.5"/></svg>`,
    undo:     `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4H2V2"/><path d="M2 4a6 6 0 1 1 .9 6"/></svg>`,
    trash:    `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M5 5l.5 8h5l.5-8"/></svg>`,
    link:     `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/><path d="M10 2h4v4"/><path d="M13.5 2.5L8 8"/></svg>`,
  };

  let _debounce = null;
  const _selected = new Set();

  loadEvents();

  function debounceLoad() {
    clearTimeout(_debounce);
    _debounce = setTimeout(loadEvents, 280);
  }

  async function loadEvents() {
    const q = document.getElementById('searchInput').value;
    const p = new URLSearchParams({ status: 'rejected' });
    if (q) p.set('q', q);
    try {
      const rows = await fetch('/api/events?' + p).then(r => r.json());
      renderList(rows);
      const n = rows.length;
      document.getElementById('countLabel').textContent = n ? `(${n})` : '';
      document.getElementById('topbarCount').textContent = n ? `${n} rejected` : '';
    } catch (e) {
      document.getElementById('eventList').innerHTML = `<div class="empty-state">Failed to load: ${esc(e.message)}</div>`;
    }
  }

  function renderList(rows) {
    const list = document.getElementById('eventList');
    if (!rows.length) {
      list.innerHTML = '<div class="empty-state">No rejected events.</div>';
      updateBulkBar();
      return;
    }
    list.innerHTML = '';
    rows.forEach(ev => list.appendChild(buildRow(ev)));
    updateBulkBar();
  }

  function buildRow(ev) {
    const div = document.createElement('div');
    div.className = `event-row${_selected.has(ev.id) ? ' selected' : ''}`;
    div.dataset.id = ev.id;

    div.innerHTML = `
      <div class="row-check">
        <input type="checkbox" ${_selected.has(ev.id) ? 'checked' : ''} onchange="toggleSelect(${ev.id},this.checked,event)">
      </div>
      <div class="row-body">
        <div class="row-header">
          <div class="row-title">${esc(ev.title || '(Untitled)')}</div>
        </div>
        <div class="row-meta">
          ${ev.organizer ? `<span>${IC.person} @${esc(ev.organizer.replace(/^@/, ''))}</span>` : ''}
          ${ev.date      ? `<span>${IC.calendar} ${esc(ev.date)}</span>` : ''}
          ${ev.time      ? `<span>${IC.clock} ${esc(ev.time)}</span>` : ''}
          ${ev.location  ? `<span>${IC.pin} ${esc(ev.location)}</span>` : ''}
        </div>
        ${ev.description ? `<div class="row-desc">${esc(ev.description)}</div>` : ''}
        ${vibeHtml(ev.vibes)}
        ${ev.source_url ? `<a class="ig-link" href="${esc(ev.source_url)}" target="_blank" rel="noopener">${IC.link} View post</a>` : ''}
      </div>
      <div class="row-actions">
        <button class="action-btn btn-review" onclick="returnToReview(${ev.id})">${IC.undo} Return to Review</button>
        <button class="action-btn btn-delete" onclick="deleteEvent(${ev.id})">${IC.trash} Delete</button>
      </div>
    `;
    return div;
  }

  // ── Actions ────────────────────────────────────────────────────────────
  async function returnToReview(id) {
    try {
      const resp = await fetch(`/api/events/${id}/review`, { method: 'POST' });
      if (!resp.ok) {
        const ct = resp.headers.get('content-type') || '';
        throw new Error(ct.includes('json') ? (await resp.json()).error : await resp.text());
      }
      toast('Event returned to review', 'success');
      _selected.delete(id);
      loadEvents();
    } catch (e) { toast(e.message, 'error'); }
  }

  async function deleteEvent(id) {
    if (!confirm('Permanently delete this event?')) return;
    try {
      const resp = await fetch(`/api/events/${id}`, { method: 'DELETE' });
      if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
      toast('Event deleted', 'success');
      _selected.delete(id);
      loadEvents();
    } catch (e) { toast(e.message, 'error'); }
  }

  async function deleteAllRejected() {
    const btn = document.getElementById('deleteAllBtn');
    try {
      const rows = await fetch('/api/events?status=rejected').then(r => r.json());
      if (!rows.length) { toast('No rejected events to delete', ''); return; }
      if (!confirm(`Permanently delete all ${rows.length} rejected event${rows.length !== 1 ? 's' : ''}?`)) return;
      btn.disabled = true;
      const ids = rows.map(r => r.id);
      const resp = await fetch('/api/events/bulk', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids, action: 'delete' }),
      });
      const { deleted } = await resp.json();
      toast(`${deleted} event${deleted !== 1 ? 's' : ''} deleted`, 'success');
      clearSelection();
      loadEvents();
    } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
    finally { btn.disabled = false; }
  }

  // ── Bulk ───────────────────────────────────────────────────────────────
  async function bulkReturnToReview() {
    const ids = [..._selected];
    if (!ids.length) return;
    let ok = 0, fail = 0;
    for (const id of ids) {
      try {
        const resp = await fetch(`/api/events/${id}/review`, { method: 'POST' });
        resp.ok ? ok++ : fail++;
      } catch { fail++; }
    }
    toast(`${ok} returned to review${fail ? `, ${fail} failed` : ''}`, fail ? 'error' : 'success');
    clearSelection();
    loadEvents();
  }

  async function bulkDeleteSelected() {
    const ids = [..._selected];
    if (!ids.length) return;
    if (!confirm(`Permanently delete ${ids.length} event${ids.length !== 1 ? 's' : ''}?`)) return;
    try {
      const resp = await fetch('/api/events/bulk', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids, action: 'delete' }),
      });
      if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
      const { deleted } = await resp.json();
      toast(`${deleted} event${deleted !== 1 ? 's' : ''} deleted`, 'success');
      clearSelection();
      loadEvents();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── Selection ──────────────────────────────────────────────────────────
  function toggleSelect(id, checked, e) {
    e.stopPropagation();
    if (checked) _selected.add(id); else _selected.delete(id);
    document.querySelector(`.event-row[data-id="${id}"]`)?.classList.toggle('selected', checked);
    updateBulkBar();
  }

  function clearSelection() {
    _selected.clear();
    document.querySelectorAll('.event-row').forEach(r => r.classList.remove('selected'));
    document.querySelectorAll('.event-row input[type=checkbox]').forEach(c => c.checked = false);
    updateBulkBar();
  }

  function updateBulkBar() {
    const n = _selected.size;
    document.getElementById('bulkBar').classList.toggle('visible', n > 0);
    document.getElementById('selectedCount').textContent = n > 0 ? `${n} selected` : '';
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  let _toastTimer = null;
  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ''; }, 2800);
  }

  function vibeHtml(vibes) {
    let tags = [];
    try { tags = JSON.parse(vibes || '[]'); } catch {}
    if (!tags.length) return '';
    return `<div class="vibe-tags">${tags.map(v => `<span class="vibe-tag">${esc(v)}</span>`).join('')}</div>`;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
